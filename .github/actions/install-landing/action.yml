name: Install the landing dependencies
description: Install Bun and the locked workspace dependencies for the landing app.

# The landing jobs all repeat this, so the pinned Bun version lives here once. The repository
# itself is checked out by the caller first, because the "is the app affected" step needs git.
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14
    - name: Install locked dependencies
      shell: bash
      run: bun install --frozen-lockfile
