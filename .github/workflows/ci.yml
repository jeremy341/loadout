name: Repository integrity

on:
  push:
    # Pushes are checked only on the three lanes. A feature branch is checked by its
    # pull request, so pushing it does not run the same checks a second time. The commit
    # that passes on development is included in the testing and main promotion PRs;
    # those lanes add merge commits which must contain the checked source tree.
    branches: [development, testing, main]
  pull_request:
    branches: [development, testing, main]
  workflow_dispatch:

permissions:
  contents: read
  # verified-tree.sh asks the API whether a commit already has a successful browser check run.
  checks: read

concurrency:
  group: repo-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-lane:
    name: Promotion lane
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate pull request source and target
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "${BASE_REF}:${HEAD_REF}" in
            development:feature/*|development:fix/*|development:refactor/*|development:docs/*|development:experiment/*|development:chore/*)
              ;;
            testing:development)
              ;;
            main:testing)
              ;;
            *)
              printf 'Unsupported promotion: %s -> %s\n' "$HEAD_REF" "$BASE_REF" >&2
              exit 1
              ;;
          esac

  lane-lineage:
    # Promotion PRs normally create merge commits containing the source-lane tip.
    # This validates the merge result after it reaches the lane. Direct pushes are also
    # checked after landing if repository settings allow them; this is not a pre-push gate.
    name: Lane lineage
    if: github.event_name == 'push' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the lane only moved forward from its source lane
        env:
          LANE: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$LANE" in
            testing) source="origin/development" ;;
            main) source="origin/testing" ;;
          esac

          if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if ! git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"; then
              printf '::error::%s did not move forward from %s.\n' "$LANE" "$BEFORE_SHA"
              exit 1
            fi
          fi

          if git merge-base --is-ancestor "$AFTER_SHA" "$source" || git merge-base --is-ancestor "$source" "$AFTER_SHA"; then
            printf '%s is on the %s line.\n' "$AFTER_SHA" "$source"
          else
            printf '::error::%s is not on the %s line. The destination commit must contain the source-lane tip in its ancestry.\n' "$AFTER_SHA" "$source"
            exit 1
          fi

  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace and pinned references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "$base_sha" ]]; then
            git diff --check "${base_sha}...HEAD"
          else
            git diff-tree --check --root -r HEAD
          fi

          while IFS='|' read -r name url expected_sha; do
            actual_url="$(git config -f .gitmodules --get "submodule.references/${name}.url")"
            test "$actual_url" = "$url"

            entry="$(git ls-tree HEAD -- "references/${name}")"
            expected_entry="$(printf '160000 commit %s\treferences/%s' "$expected_sha" "$name")"
            if [[ "$entry" != "$expected_entry" ]]; then
              printf 'Unexpected submodule pin for %s: %s\n' "$name" "$entry"
              exit 1
            fi
          done <<'REFERENCES'
          pixl|https://github.com/hackclub/pixl.git|8141b992e92e05583246fd914c63a101100f6fe4
          ysws-template|https://github.com/EDRipper/ysws-template.git|1ac191fa5eee1e57983b29ab7101f700c166e207
          stardance|https://github.com/hackclub/stardance.git|3a0fe8148b07c1edfe005e94dfc9d1faa4b64c14
          stasis|https://github.com/hackclub/stasis.git|7a230ced9ad793f0ad4cda30a7d71c02a58da6b6
          REFERENCES

  # The landing jobs always run and always report, so a required check is never "skipped" by
  # accident. A documentation-only change finishes after the first step. Every code change gets the
  # full set (lint, typecheck, unit tests, production build, browser suite), so one green commit is
  # good enough for every lane.
  #
  # The browser suite is the long pole, so it is spread across five runners that run at the same
  # time as the quality job. Shards are separate runners rather than more Playwright workers on one
  # runner on purpose: Orry's tests read a real pointer in real time, so piling workers onto one
  # machine makes them flaky. A single aggregator job keeps the required check name
  # "Landing browser" stable, which is what branch protection and scripts/ship.ps1 look for.
  landing-quality:
    name: Landing quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find out whether the app is affected
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/app-changed.sh
      - name: Install Bun and the locked dependencies
        if: steps.changed.outputs.app == 'true'
        uses: ./.github/actions/install-landing
      - name: Check the already-verified rule
        if: steps.changed.outputs.app == 'true'
        run: bash .github/scripts/verified-tree.test.sh
      - name: Lint
        if: steps.changed.outputs.app == 'true'
        run: bun run lint
      - name: Typecheck
        if: steps.changed.outputs.app == 'true'
        run: bun run typecheck
      - name: Unit tests
        if: steps.changed.outputs.app == 'true'
        run: bun run test
      - name: Production build
        if: steps.changed.outputs.app == 'true'
        run: bun run build

  browser-shard:
    name: Browser ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # The browser jobs read these to pick their slice of the suite: the two Orry files get their
    # own runners, and everything else is sharded three ways. An empty value falls back to the
    # config default, so one spec can never be dropped from every job.
    env:
      LOADOUT_E2E_MATCH: ${{ matrix.match }}
      LOADOUT_E2E_IGNORE: ${{ matrix.ignore }}
    # The pinned Playwright image already carries Chromium and its system libraries, so a shard
    # skips the download and the apt install that used to cost about twenty seconds each. The
    # image tag must match the locked @playwright/test version in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user root
    strategy:
      fail-fast: false
      # Five jobs cover the suite exactly once: one per Orry file, plus three shards of the rest.
      matrix:
        include:
          - name: Orry mood
            match: mole-mood.spec.ts
            ignore: ""
            shard: "1/1"
          - name: Orry body
            match: mole-body.spec.ts
            ignore: ""
            shard: "1/1"
          - name: checks 1/3
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "1/3"
          - name: checks 2/3
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "2/3"
          - name: checks 3/3
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "3/3"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace
        # This job runs inside a container as root while the checkout is owned by another user, so
        # git refuses to read the repository until the path is marked safe. Without this, both
        # app-changed.sh and verified-tree.sh fail their git calls and silently fall back to
        # "run everything", which is safe but hides why the browser suite never skips.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Find out whether the app is affected
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/app-changed.sh
      - name: Find out whether this tree is already verified
        id: verified
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verified-tree.sh
      - name: Add the one tool the Bun setup needs
        if: steps.changed.outputs.app == 'true' && steps.verified.outputs.verified != 'true'
        # The Playwright image carries Chromium and its libraries but not unzip, which setup-bun uses.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
      - name: Install Bun and the locked dependencies
        if: steps.changed.outputs.app == 'true' && steps.verified.outputs.verified != 'true'
        uses: ./.github/actions/install-landing
      - name: Confirm Chromium is present
        if: steps.changed.outputs.app == 'true' && steps.verified.outputs.verified != 'true'
        working-directory: apps/landing
        # A no-op when the image already matches the locked version, and a repair when it does not.
        run: bunx playwright install chromium
      - name: Confirm this job has tests to run
        if: steps.changed.outputs.app == 'true' && steps.verified.outputs.verified != 'true'
        working-directory: apps/landing
        # The container's default shell is sh, which has no pipefail.
        shell: bash
        # `playwright test` exits 0 when a filter matches nothing, so a mistyped or stale matrix
        # entry could pass a required check without running its slice. Fail instead.
        run: |
          set -euo pipefail
          count="$(bunx playwright test --list --shard=${{ matrix.shard }} | grep -cE 'spec\.ts:[0-9]+:[0-9]+' || true)"
          if [ "$count" -eq 0 ]; then
            printf '::error::This browser job would run no tests; its filter or shard is wrong.\n'
            exit 1
          fi
          printf 'This job will run %s tests.\n' "$count"
      - name: Browser and accessibility checks
        if: steps.changed.outputs.app == 'true' && steps.verified.outputs.verified != 'true'
        working-directory: apps/landing
        run: bunx playwright test --shard=${{ matrix.shard }}
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-shard-${{ strategy.job-index }}
          path: |
            apps/landing/test-results
            apps/landing/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  landing-browser:
    # The one required check for the browser suite. It reports all five shards as a single name, so
    # branch protection and ship.ps1 need no change, and it pads nothing: it fails unless every
    # shard that ran passed.
    name: Landing browser
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate the browser shards
        env:
          SHARDS: ${{ needs.browser-shard.result }}
        run: |
          set -euo pipefail

          case "$SHARDS" in
            success)
              # A shard whose steps were all skipped because no browser run was needed also
              # reports success, so say what actually happened rather than claiming a run.
              printf 'The browser jobs finished successfully; any shard that had tests to run passed them.\n'
              ;;
            skipped)
              # Either a documentation-only change or a tree that already passed on its lane.
              printf 'Browser shards were not needed for this change.\n'
              ;;
            *)
              printf '::error::The browser shards did not pass (%s). Nothing was bypassed.\n' "$SHARDS"
              exit 1
              ;;
          esac
