name: Repository integrity

on:
  # One lane: a pull request into main is checked once, and merging it deploys. A feature branch
  # is checked by its pull request, so a push does no second run, and main is not rechecked after
  # the merge because the pull request already ran the same checks on the same tree.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions and shell scripts
        run: bash .github/scripts/lint-workflows.sh

      - name: Check kept files are present
        run: |
          bash .github/scripts/check-kept-files.test.sh
          bash .github/scripts/check-kept-files.sh

      - name: Check whitespace and pinned references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -n "$base_sha" ]]; then
            git diff --check "${base_sha}...HEAD"
          else
            git diff-tree --check --root -r HEAD
          fi

          bash .github/scripts/check-reference-pins.sh

  # The landing jobs always run and always report, so a required check is never "skipped" by
  # accident. Documentation-only and reference-pin-only changes finish after the change-detection
  # step. Public Docs and app changes get the full set (lint, typecheck, unit tests, production
  # build, browser suite), so one green commit is good enough for every lane.
  #
  # The browser suite is the long pole, so it is spread across eight runners that run at the same
  # time as the quality job. Shards are separate runners rather than more Playwright workers on one
  # runner on purpose: Orry's tests read a real pointer in real time, so piling workers onto one
  # machine makes them flaky. A single aggregator job keeps the required check name
  # "Landing browser" stable, which is what branch protection looks for.
  landing-quality:
    name: Landing quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find out whether the app is affected
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/app-changed.sh
      - name: Install Bun and the locked dependencies
        if: steps.changed.outputs.app == 'true'
        uses: ./.github/actions/install-landing
      - name: Generate the Prisma client
        if: steps.changed.outputs.app == 'true'
        working-directory: apps/landing
        run: bunx prisma generate
      - name: Lint
        if: steps.changed.outputs.app == 'true'
        run: bun run lint
      - name: Typecheck
        if: steps.changed.outputs.app == 'true'
        run: bun run typecheck
      - name: Unit tests
        if: steps.changed.outputs.app == 'true'
        run: bun run test
      - name: Production build
        if: steps.changed.outputs.app == 'true'
        run: bun run build

  browser-shard:
    name: Browser ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The browser jobs read these to pick their slice of the suite: the two Orry files get their
    # own runners, and everything else is sharded six ways. An empty value falls back to the
    # config default, so one spec can never be dropped from every job.
    env:
      LOADOUT_E2E_MATCH: ${{ matrix.match }}
      LOADOUT_E2E_IGNORE: ${{ matrix.ignore }}
      DATABASE_URL: postgresql://loadout:loadout-local@postgres:5432/loadout_dev
      LOADOUT_LOCAL_TEST_ACCOUNTS: "true"
      LOADOUT_UPLOADS: "true"
    # The pinned Playwright image already carries Chromium and its system libraries, so a shard
    # skips the download and the apt install that used to cost about twenty seconds each. The
    # image tag must match the locked @playwright/test version in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user root
    # The participant specs sign in as local test accounts and read a real database. Each shard gets
    # its own empty Postgres, migrated and seeded before Playwright starts its web server.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loadout
          POSTGRES_PASSWORD: loadout-local
          POSTGRES_DB: loadout_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      # Eight jobs cover the suite exactly once: one per Orry file, plus six shards of the rest.
      matrix:
        include:
          - name: Orry mood
            match: mole-mood.spec.ts
            ignore: ""
            shard: "1/1"
          - name: Orry body
            match: mole-body.spec.ts
            ignore: ""
            shard: "1/1"
          - name: checks 1/6
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "1/6"
          - name: checks 2/6
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "2/6"
          - name: checks 3/6
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "3/6"
          - name: checks 4/6
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "4/6"
          - name: checks 5/6
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "5/6"
          - name: checks 6/6
            match: ""
            ignore: mole-mood.spec.ts,mole-body.spec.ts
            shard: "6/6"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace
        # This job runs inside a container as root while the checkout is owned by another user, so
        # git refuses to read the repository until the path is marked safe. Without this, both
        # app-changed.sh fails its git calls and silently falls back to
        # "run everything", which is safe but hides why the browser suite never skips.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Find out whether the app is affected
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/app-changed.sh
      - name: Add the one tool the Bun setup needs
        if: steps.changed.outputs.app == 'true'
        # The Playwright image carries Chromium and its libraries but not unzip, which setup-bun uses.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
      - name: Install Bun and the locked dependencies
        if: steps.changed.outputs.app == 'true'
        uses: ./.github/actions/install-landing
      - name: Generate the Prisma client
        if: steps.changed.outputs.app == 'true'
        working-directory: apps/landing
        run: bunx prisma generate
      - name: Migrate and seed the browser database
        if: steps.changed.outputs.app == 'true'
        working-directory: apps/landing
        run: |
          bunx prisma migrate deploy
          bun run scripts/seed-local-accounts.ts
      - name: Confirm Chromium is present
        if: steps.changed.outputs.app == 'true'
        working-directory: apps/landing
        # A no-op when the image already matches the locked version, and a repair when it does not.
        run: bunx playwright install chromium
      - name: Confirm this job has tests to run
        if: steps.changed.outputs.app == 'true'
        working-directory: apps/landing
        # The container's default shell is sh, which has no pipefail.
        shell: bash
        # `playwright test` exits 0 when a filter matches nothing, so a mistyped or stale matrix
        # entry could pass a required check without running its slice. Fail instead.
        run: |
          set -euo pipefail
          count="$(bunx playwright test --list --shard=${{ matrix.shard }} | grep -cE 'spec\.ts:[0-9]+:[0-9]+' || true)"
          if [ "$count" -eq 0 ]; then
            printf '::error::This browser job would run no tests; its filter or shard is wrong.\n'
            exit 1
          fi
          printf 'This job will run %s tests.\n' "$count"
      - name: Browser and accessibility checks
        if: steps.changed.outputs.app == 'true'
        working-directory: apps/landing
        run: bunx playwright test --shard=${{ matrix.shard }}
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-shard-${{ strategy.job-index }}
          path: |
            apps/landing/test-results
            apps/landing/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  landing-browser:
    # The one required check for the browser suite. It reports all five shards as a single name, so
    # branch protection needs no change, and it pads nothing: it fails unless every
    # shard that ran passed.
    name: Landing browser
    needs: [repository-integrity, browser-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate the browser shards
        env:
          INTEGRITY: ${{ needs.repository-integrity.result }}
          SHARDS: ${{ needs.browser-shard.result }}
        run: |
          set -euo pipefail

          if [[ "$INTEGRITY" != "success" ]]; then
            printf '::error::Repository integrity failed; browser checks were not started.\n'
            exit 1
          fi

          case "$SHARDS" in
            success)
              # A shard whose steps were all skipped because no browser run was needed also
              # reports success, so say what actually happened rather than claiming a run.
              printf 'The browser jobs finished successfully; any shard that had tests to run passed them.\n'
              ;;
            skipped)
              # Either a documentation-only change or a tree that already passed on its lane.
              printf 'Browser shards were not needed for this change.\n'
              ;;
            *)
              printf '::error::The browser shards did not pass (%s). Nothing was bypassed.\n' "$SHARDS"
              exit 1
              ;;
          esac
