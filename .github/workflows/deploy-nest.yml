name: Deploy Nest

on:
  # Checks run on the pull request, so a push to main is already a verified tree.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-nest
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.NEST_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun and the locked dependencies
        uses: ./.github/actions/install-landing

      - name: Generate the Prisma client
        working-directory: apps/landing
        run: bunx prisma generate

      - name: Build the production app
        working-directory: apps/landing
        run: bun run build

      - name: Create the immutable release archive
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/loadout-$RELEASE_SHA.tgz" \
            --exclude=.git \
            --exclude=apps/landing/.env.local \
            --exclude=apps/landing/test-results \
            --exclude=apps/landing/playwright-report \
            -C . apps/landing node_modules package.json bun.lock

      - name: Configure SSH
        env:
          NEST_DEPLOY_KEY: ${{ secrets.NEST_DEPLOY_KEY }}
          NEST_KNOWN_HOSTS: ${{ secrets.NEST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$NEST_DEPLOY_KEY" > "$HOME/.ssh/loadout_deploy"
          chmod 600 "$HOME/.ssh/loadout_deploy"
          printf '%s\n' "$NEST_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload and verify release archive
        env:
          RELEASE_SHA: ${{ github.sha }}
          NEST_HOST: ${{ secrets.NEST_HOST }}
          NEST_USER: ${{ secrets.NEST_USER }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/loadout-$RELEASE_SHA.tgz"
          destination="$NEST_USER@$NEST_HOST"
          final="/tmp/loadout-$RELEASE_SHA.tgz"
          partial="$final.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.part"
          checksum=$(sha256sum "$archive")
          checksum=${checksum%% *}
          options=(-i "$HOME/.ssh/loadout_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes
                   -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          printf -v verify_command 'printf "%%s  %%s\\n" %q %q | sha256sum --check --status && mv -f -- %q %q' \
            "$checksum" "$partial" "$partial" "$final"
          printf -v cleanup_command 'rm -f -- %q' "$partial"
          for attempt in 1 2 3; do
            echo "Uploading release $RELEASE_SHA (attempt $attempt of 3)"
            if ! scp "${options[@]}" "$archive" "$destination:$partial"; then
              echo "::warning::SCP reported a failure; checking whether the complete archive arrived."
            fi
            if printf '%s\n' "$verify_command" | ssh "${options[@]}" "$destination" 'bash -s'; then
              echo "Verified the release archive on Nest."
              exit 0
            fi
            echo "::warning::Could not verify or promote the Nest archive on attempt $attempt."
          done
          printf '%s\n' "$cleanup_command" | ssh "${options[@]}" "$destination" 'bash -s' || true
          echo "::error::Failed to upload a verified Nest release archive after three attempts."
          exit 1

      - name: Deploy and verify
        env:
          RELEASE_SHA: ${{ github.sha }}
          NEST_HOST: ${{ secrets.NEST_HOST }}
          NEST_USER: ${{ secrets.NEST_USER }}
        run: |
          ssh -i "$HOME/.ssh/loadout_deploy" "$NEST_USER@$NEST_HOST" \
            "RELEASE_SHA=$RELEASE_SHA RELEASE_ARCHIVE=/tmp/loadout-$RELEASE_SHA.tgz APP_ROOT=/srv/loadout bash -s" \
            < apps/landing/scripts/deploy-nest.sh
